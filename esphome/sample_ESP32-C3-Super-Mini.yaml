# WARNING: this is a SAMPLE file, provided as-is with no guarantee it will
# work unmodified on your specific board or setup. Always verify the pin
# layout below against your own hardware before flashing — wiring the CC1101
# or ESP incorrectly can damage the module or the board.
#
# ESPHome bridge for Gumax RF (433.92 MHz OOK)
# Fully optimized for the Nologo ESP32-C3 Super Mini
#
# Built and tested with: Nologo ESP32-C3 Super Mini + CC1101 433 MHz RF module
#
# CC1101 Pin layout - Top view:
#   ----------------------------------------------
#   | 1 - GND     2 - VCC          -------       | ----------
#   | 3 - GDO0    4 - CSN         |       |      | Antenna
#   | 5 - SCK     6 - MOSI        |       |      | Antenna
#   | 7 - MISO    8 - GD02         -------       | ----------
#   ----------------------------------------------
#   1 - GND    - Ground
#   2 - VCC    - 1.8V-3.6V
#   3 - GDO0   - Module OUT
#   4 - CSN    - SPI Chip Select
#   5 - SCK    - SPI Clock
#   6 - MOSI   - SPI Master Out, Slave In
#   7 - MISO   - SPI Master In, Slave Out
#   8 - GDO2   - Module OUT
#
# Wiring (ESP32-C3 Super Mini ↔ CC1101):
#   3 - GDO0   → GPIO1   (transmit data)
#   4 - CSN    → GPIO7
#   5 - SCK    → GPIO4
#   6 - MOSI   → GPIO10
#   7 - MISO   → GPIO3
#   8 - GDO2   → GPIO2   (receive data)
#
# Flash: esphome run sample_ESP32-C3-Super-Mini.yaml

esphome:
  name: gumax-rf-mini-test
  friendly_name: Gumax RF Controller Mini Test
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: nologo_esp32c3_super_mini   # Works perfectly on up-to-date systems!
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret gumax_api_key
  actions:
    - action: transmit_raw
      variables:
        pulses: string
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda |-
              std::vector<int32_t> timings;
              const char *str = pulses.c_str();
              char *end;
              while (*str) {
                long val = strtol(str, &end, 10);
                if (end == str) break;
                timings.push_back((int32_t)val);
                str = end;
                if (*str == ',') str++;
              }
              return timings;
            carrier_frequency: 0Hz

ota:
  - platform: esphome
    password: !secret gumax_ota_password

wifi:
  min_auth_mode: WPA2
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  power_save_mode: HIGH
  fast_connect: True
  ap:
    ssid: "Gumax-Rf Fallback Hotspot"
    password: !secret gumax_ap_password

captive_portal:

esp32_ble:
  enable_on_boot: false

# Physical hardware SPI bus settings for the C3 Mini
spi:
  clk_pin: GPIO4
  mosi_pin: GPIO10
  miso_pin: GPIO3
  interface: hardware

# Official built-in CC1101 component from ESPHome
cc1101:
  id: cc1101_chip
  cs_pin: GPIO7
  frequency: 433.92MHz
  output_power: 10

# Transmit via CC1101 GDO0 (connected to ESP GPIO1)
remote_transmitter:
  id: rf_tx
  pin:
    number: GPIO1     # Avoids timing conflicts on the C3 hardware matrix
  carrier_duty_percent: 100%
  non_blocking: false

  on_transmit:
    then:
      - logger.log: "CC1101 switching to TX"
      - cc1101.begin_tx: cc1101_chip
  on_complete:
    then:
      - logger.log: "CC1101 switching to RX"
      - delay: 20ms
      - cc1101.begin_rx: cc1101_chip

# Receive via CC1101 GDO2 (connected to ESP GPIO2)
remote_receiver:
  id: rf_rx
  pin:
    number: GPIO2
    mode:
      input: true
      pullup: true    # Filters electronic noise from the mini's regulator
  tolerance: 35%
  filter: 20us
  idle: 20ms
#  dump: raw # For debugging
  on_raw:
    then:
      - homeassistant.event:
          event: esphome.gumax_rf_capture
          data:
            pulses: !lambda |-
              std::string s;
              for (size_t i = 0; i < x.size(); i++) {
                if (i) s += ',';
                s += std::to_string(x[i]);
              }
              return s;

infrared:
  - platform: ir_rf_proxy
    name: "RF Proxy Transmitter"
    id: rf_proxy_tx
    remote_transmitter_id: rf_tx
    frequency: 433.92MHz

switch:
  - platform: restart
    name: "Restart"

sensor:
  - platform: uptime
    id: uptime_s
    name: "Uptime"
    update_interval: 60s
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi RSSI"
    update_interval: 30s

binary_sensor:
  - platform: status
    name: "Online"

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
